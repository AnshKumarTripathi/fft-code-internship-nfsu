<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Activity timeline schematic</title>
  <desc id="desc">Line chart of event counts over UTC time with shaded detector flag bands.</desc>
  <rect width="720" height="280" fill="#f7f6f2"/>
  <text x="24" y="28" fill="#1c1b19" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="15" font-weight="600">Activity timeline</text>
  <text x="24" y="48" fill="#5c5954" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">Y = events per bucket | X = UTC time | shaded = flagged windows</text>
  <rect x="64" y="68" width="620" height="160" fill="#fffefb" stroke="#d8d4cc"/>
  <rect x="280" y="68" width="70" height="160" fill="#d9775733"/>
  <rect x="430" y="68" width="95" height="160" fill="#14828240"/>
  <text x="292" y="86" fill="#8a4b36" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="10">rate</text>
  <text x="448" y="86" fill="#0f5f5a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="10">rhythm</text>
  <polyline fill="none" stroke="#148282" stroke-width="2.2" points="80,190 130,185 180,178 230,170 290,95 330,110 380,165 450,88 500,100 550,155 620,148 660,152"/>
  <text x="18" y="150" fill="#5c5954" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" transform="rotate(-90 18 150)">count</text>
  <text x="64" y="250" fill="#5c5954" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">earlier</text>
  <text x="640" y="250" fill="#5c5954" font-family="IBM Plex Mono, Consolas, monospace" font-size="10">later (UTC)</text>
  <text x="64" y="268" fill="#5c5954" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="10">Toggle overlay sources above the live chart; scroll-zoom / drag-pan; Reset zoom when lost.</text>
</svg>
